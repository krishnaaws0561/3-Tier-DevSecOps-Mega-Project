name: node.js CI

on: 
  push:
    branches: [ main ]


jobs:
  compile:
    runs-on: agent-1
    steps:
      - name: checkout the code
        uses: actions/checkout@v7
      - name: setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '23'

      - name: frontend compilation
        run: |
          cd client
          find . -iname "*.js" -exec node --check {} +

      - name: backend compilation
        run: |
          cd api
          find . -iname "*.js" -exec node --check {} +
          
